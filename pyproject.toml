[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "jlens-crywolf"
version = "0.1.0"
description = "Pilot experiments on the specificity of Jacobian-Lens evaluation readouts"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
model = [
  "jlens @ git+https://github.com/anthropics/jacobian-lens.git@581d398613e5602a5af361e1c34d3a92ea82ba8e",
  "transformers>=5.5,<6",
  "torch>=2.6",
]

[project.scripts]
crywolf = "crywolf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

